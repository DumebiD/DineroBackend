services:
  api:
    build: 
      context: .
      target: ${BUILD_TARGET:-development}
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      POSTGRES_HOST: postgres # the service name
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TYPEORM_SYNCHRONISE: ${TYPEORM_SYNCHRONISE:-false} #set to false in prod
      REDIS_HOST: redis # the service name
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    # we use environment instead of env file to prevent issues with coolify
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set}
      POSTGRES_DB: ${POSTGRES_DB}
    # ports:
    #   - '${POSTGRES_PORT:-5432}:5432'
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dinero_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
  
